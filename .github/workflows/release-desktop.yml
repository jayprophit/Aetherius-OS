name: Desktop release

# Reproducible desktop artifacts. Runs only on demand or on a version tag.
# Mobile builds are documented in packaging/mobile/README.md and stay
# owner-gated until signing identities exist.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web shell
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build desktop bundle
        run: npm run desktop:build -- --target ${{ matrix.target }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aetherius-desktop-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle
          if-no-files-found: error

      - name: Record artifact hashes
        shell: bash
        run: |
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > "aetherius-desktop-${{ matrix.target }}-SHA256SUMS.txt"

      - name: Upload hashes
        uses: actions/upload-artifact@v4
        with:
          name: aetherius-desktop-${{ matrix.target }}-hashes
          path: aetherius-desktop-${{ matrix.target }}-SHA256SUMS.txt
