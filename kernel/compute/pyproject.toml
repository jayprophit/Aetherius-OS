[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherius-kernel"
version = "0.1.0"
description = "Aetherius compute kernel: packed binary, balanced ternary, and state-vector quantum simulation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aetherius_kernel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
