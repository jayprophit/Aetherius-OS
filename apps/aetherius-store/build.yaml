# =============================================================================
# BUILD MANIFEST - Aetherius Store
# =============================================================================
# Authoritative record of how this project is built, tested and verified, and
# of what is still broken. Read by Aetherius-OS's build manifest registry
# (docs/BUILD-MANIFEST-REGISTRY.yaml) and validated by
# src/programme/buildManifest.ts.
# =============================================================================
schema_version: "1.0.0"

project:
  id: aetherius-store
  name: Aetherius Store
  kind: application
  domain: platform
  description: >-
    The package store core: a signed catalogue, semver parsing and ranges,
    platform/architecture artifact selection, dependency resolution, permission
    and entitlement gates, disk-space checks, dependency-ordered install plans,
    update, rollback, uninstall and signing-key revocation, with a hash-chained
    audit trail. It plans and records installs; it does not download or execute
    artifacts.
  repository: false
  languages: [typescript]

toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
      purpose: runs the TypeScript sources directly via type stripping; there is no build step
    - name: typescript
      version: "~5.8.2"
      required: false
      purpose: typecheck only, provided by the Aetherius-OS root devDependencies

commands:
  - name: test
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
  - name: typecheck
    command: npx tsc -p ../tsconfig.json --noEmit
    working_directory: .
    timeout_minutes: 10
  - name: verify
    command: node --test "tests/*.test.ts" && npx tsc -p ../tsconfig.json --noEmit
    working_directory: .
    timeout_minutes: 10
    requires: [test, typecheck]

dependencies:
  projects: [aetherius-os]
  external: []

status:
  state: PARTIAL
  last_verified: "2026-10-29"
  summary: >-
    The store core is built and tested: semver, signature gating, search,
    artifact selection, dependency ordering, cycle refusal, permission and
    entitlement checks, disk-space checks, install/update/rollback, uninstall
    and key revocation. Every state change is recorded on a hash-chained
    EventLedger. The signature verifier is a demo interface implementation, not
    a real cryptographic verifier, and no artifact is downloaded or executed.
    There is no store user interface or hosted catalogue service.
  evidence:
    - "2026-10-29: node --test \"tests/*.test.ts\" in apps/aetherius-store -> 11 tests passed, 0 failed."
    - "2026-10-29: the tests cover semver ordering and ranges, unsigned/bad-signature refusal, digest-stable publishing, highest-compatible resolution, dependency-first plans and size totals, permission/entitlement refusal, disk-space refusal, install/update/rollback history, uninstall, key revocation and dependency cycles."
    - "2026-10-29: npx tsc -p apps/tsconfig.json --noEmit -> exit 0 across all 16 app slices."
    - "2026-10-29: node apps/verify.mjs -> 16/16 slices passed."

known_issues:
  - id: STORE-001
    severity: high
    summary: >-
      Signatures are checked through a caller-supplied SignatureVerifier. The
      bundled DemoSignatureVerifier accepts any non-empty signature; it is not
      a real cryptographic verifier.
    evidence: >-
      AetheriusStore accepts a SignatureVerifier port. DemoSignatureVerifier
      returns valid for any non-empty string, and no public key, trust root or
      transparency log is configured.
    status: OPEN
  - id: STORE-002
    severity: high
    summary: >-
      The store plans and records installs but does not download, unpack or
      execute an artifact, and does not write to a real application directory.
    evidence: >-
      InstallPlan is a list of ordered steps and InstalledApp is an in-memory
      record; there is no network client, archive reader or process launcher.
    status: OPEN
  - id: STORE-003
    severity: medium
    summary: >-
      Entitlements and permissions are caller-supplied. OwnsEverything is a
      demo implementation, not an account or purchase system.
    evidence: >-
      StoreEntitlements is an interface with an `owns` method; the bundled
      OwnsEverything returns true for every app. No account, payment or licence
      server is connected.
    status: OPEN
  - id: STORE-004
    severity: medium
    summary: >-
      There is no store user interface and no hosted catalogue service.
    evidence: >-
      apps/aetherius-store contains a domain core and tests only; there is no
      route, screen or HTTP service.
    status: OPEN

notes:
  - "The owner asked for an Aetherius Store and installers/packages in the style of Apple, Linux and Microsoft. This slice is the store core; the desktop slice plans the per-OS package formats."
