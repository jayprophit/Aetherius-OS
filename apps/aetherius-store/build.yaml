schema_version: "1.0.0"
project:
  id: aetherius-store
  name: Aetherius Store
  kind: application
  domain: apps
  description: Domain core for Aetherius Store.
  repository: false
  languages: [typescript]
toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
commands:
  - name: test
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
  - name: verify
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
dependencies:
  projects: [aetherius-os, app-kit]
  external: []
status:
  state: PARTIAL
  last_verified: "2026-11-02"
  summary: "Domain core. No UI or host adapters yet."
  evidence:
    - "2026-11-02: node --test tests/*.test.ts -> tests pass"
known_issues:
  - id: aetherius-store-001
    severity: high
    summary: "No UI, window, or host filesystem adapter."
    evidence: The slice exports a domain core and tests only; no renderer,
      window manager, or host filesystem adapter is implemented.
    status: OPEN
