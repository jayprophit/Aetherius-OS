schema_version: "1.0.0"
project:
  id: aetherius-canvas
  name: Aetherius Canvas
  kind: application
  domain: apps
  description: Domain core for Canvas.
  repository: false
  languages: [typescript]
toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
commands:
  - name: test
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
  - name: verify
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
dependencies:
  projects: [aetherius-os, app-kit]
  external: []
status:
  state: TESTED
  last_verified: "2026-11-03"
  summary: "Functional canvas with shapes, layers, selection, transforms, undo/redo, persistence, and SVG export."
  evidence:
    - "2026-11-03: node --test tests/*.test.ts -> 8/8 pass"
    - "2026-11-03: verify-canvas.js confirms create/edit/reorder/select/undo/redo/persist/SVG export"
known_issues:
  - id: aetherius-canvas-001
    severity: medium
    summary: "No native GUI, host adapter, or raster export."
    status: OPEN
