# =============================================================================
# BUILD MANIFEST - Aetherius OS Commerce
# =============================================================================
# Authoritative record of how this project is built, tested and verified, and
# of what is still broken. Read by Aetherius-OS's build manifest registry
# (docs/BUILD-MANIFEST-REGISTRY.yaml) and validated by
# src/programme/buildManifest.ts.
# =============================================================================
schema_version: "1.0.0"

project:
  id: aetherius-commerce
  name: Aetherius OS Commerce
  kind: application
  domain: commerce
  description: >-
    The Aetherius OS Commerce and Marketplace application: the storefront, the merchant administration, the checkout and the payment providers. An integrated application domain of the one Aetherius ecosystem, not a platform of its own.
  repository: false
  languages: [typescript]

toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
      purpose: runs the TypeScript sources directly via type stripping; there is no build step
    - name: typescript
      version: "~5.8.2"
      required: false
      purpose: typecheck only, provided by the Aetherius-OS root devDependencies

commands:
  - name: test
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
  - name: typecheck
    command: npx tsc -p ../tsconfig.json --noEmit
    working_directory: .
    timeout_minutes: 10
  - name: verify
    command: node --test "tests/*.test.ts" && npx tsc -p ../tsconfig.json --noEmit
    working_directory: .
    timeout_minutes: 10
    requires: [test, typecheck]

dependencies:
  projects: [aetherius-os, agent-bridge, genesis]
  external: []

status:
  state: PARTIAL
  last_verified: "2026-10-25"
  summary: >-
    The commerce domain slice is built and tested: catalogue, cart, idempotent
    checkout, inventory, a deterministic local test payment provider,
    fulfilment, refund, entitlements, sales reporting and ledger events. It is
    not yet mounted in the Aetherius OS host UI, and no real payment provider
    is connected.
  evidence:
    - "2026-10-25: node --test \"tests/*.test.ts\" -> 6 tests passed."
    - "2026-10-25: npx tsc -p apps/tsconfig.json --noEmit -> exit 0 (all four app slices)."
    - "2026-10-25: node apps/verify.mjs -> 4/4 slices passed."
    - "The service uses the shared app-kit accounts, entitlements, notifications and hash-chained ledger."

known_issues:
  - id: AETHERIUS-COMMERCE-001
    severity: medium
    summary: >-
      The domain slice is built and listed in the host application registry,
      but the storefront UI and a real payment provider are not.
    evidence: >-
      The service and its tests live in apps/aetherius-commerce and
      src/apps/registry.ts lists the application; the storefront and merchant
      views are not built, and the only payment provider is
      LocalTestPaymentProvider. A real financial transaction is not performed
      without the owner's approval.
    status: OPEN
    todo_ref: TODO-APP-003

notes:
  - >-
    Named as a first-party application in the Figma handoff of 17 October 2026, with the concepts taken from the WooCommerce archive. The shared primitives are in docs/APPLICATION-SHARED-PRIMITIVES.yaml and are not duplicated here: the account, permission, search, notification and payment mechanisms are the ones the rest of Aetherius uses.
  - >-
    The Figma handoff's V2 inputs table gives the destination as Aetherius OS Commerce and Marketplace, with WooCommerce 7.4.0 as the concept source and Coinbase Commerce 1.2.1 as an optional payment provider. Both are third-party and are referenced, not copied.
  - >-
    A real financial transaction is not performed and a paid service is not provisioned
    without the owner's approval.
