# =============================================================================
# BUILD MANIFEST - Sovereign Financial OS
# =============================================================================
# Authoritative record of how this project is built, tested and verified, and
# of what is still broken. Read by Aetherius-OS's build manifest registry
# (docs/BUILD-MANIFEST-REGISTRY.yaml) and validated by
# src/programme/buildManifest.ts.
# =============================================================================
schema_version: "1.0.0"

project:
  id: sovereign-financial-os
  name: Sovereign Financial OS
  kind: application
  domain: finance
  description: >-
    The sovereign financial operating system: a double-entry ledger, invoices,
    tax, budgets, reconciliation, risk limits, reversals and an audit trail.
    Money is held in integer minor units. No live bank, card or exchange
    connection is claimed.
  repository: false
  languages: [typescript]

toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
      purpose: runs the TypeScript sources directly via type stripping; there is no build step
    - name: typescript
      version: "~5.8.2"
      required: false
      purpose: typecheck only, provided by the Aetherius-OS root devDependencies

commands:
  - name: test
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
  - name: typecheck
    command: npx tsc -p ../tsconfig.json --noEmit
    working_directory: .
    timeout_minutes: 10
  - name: verify
    command: node --test "tests/*.test.ts" && npx tsc -p ../tsconfig.json --noEmit
    working_directory: .
    timeout_minutes: 10
    requires: [test, typecheck]

dependencies:
  projects: [aetherius-os]
  external: []

status:
  state: PARTIAL
  last_verified: "2026-11-02"
  summary: >-
    The financial core and durable persistence adapter are built and tested.
    Double-entry posting, invoices, budgets, reconciliation, audit trail,
    file-backed persistence (JSON line storage), and interface module are
    completed. The user interface framework integration (desktop/mobile routes),
    live bank/card/exchange adapter, and regulatory filing tools remain out of
    scope and are not claimed.
  evidence:
    - "2026-10-30: node --test \"tests/*.test.ts\" in apps/sovereign-financial-os -> 14 tests passed, 0 failed."
    - "2026-11-02: node apps/verify.mjs -> @aetherius/sovereign-finance 14/14 passed; 15/15 slices passed overall."
    - "2026-11-02: npx tsc -p apps/tsconfig.json --noEmit -> exit 0."
    - "2026-11-02: durable JSON persistence adapter and FinancialService interface added."

known_issues:
  - id: SOVEREIGN-FINANCE-LIVE-001
    severity: high
    summary: >-
      No live bank, card or exchange adapter. Balances are internal records; no
      regulatory certification, audit opinion or tax filing capability is claimed.
    evidence: The slice deliberately omits provider clients, credentials flows,
      webhooks or tax-filing endpoints; the durable JSON line storage replaces
      MemoryRepository only within Aetherius first-party scope.
    status: OPEN
  - id: SOVEREIGN-FINANCE-UI-001
    severity: medium
    summary: >-
      The desktop/mobile user interface framework integration is not built.
    evidence: apps/sovereign-financial-os exposes interface-layer services now;
      rendering routes must still be provisioned by the platform's UI framework.
    status: OPEN

notes:
  - "The slice uses the shared app-kit money helpers and hash-chained EventLedger."
  - "No regulatory certification, audit opinion or tax filing capability is claimed."
