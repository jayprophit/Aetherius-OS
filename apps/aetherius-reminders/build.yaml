schema_version: "1.0.0"
project:
  id: aetherius-reminders
  name: Aetherius Reminders
  kind: application
  domain: apps
  description: >-
    Lists of reminders with due dates, priority, subtasks and completion
    tracking. Location triggers are recorded as data; no device location is
    read in this layer.
  repository: false
  languages: [typescript]
toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
commands:
  - name: test
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
  - name: verify
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
dependencies:
  projects: [aetherius-os, app-kit]
  external: []
status:
  state: TESTED
  last_verified: "2026-11-07"
  summary: "Real domain core: create, list by list, update, complete, reopen, subtasks, overdue and due-soon reporting. 5 behaviour tests + scaffold import test pass."
  evidence:
    - "2026-11-07: npm test (slice) -> 6/6 pass"
    - "2026-11-07: tsc -p apps/tsconfig.json --noEmit passes"
known_issues:
  - id: reminders-001
    severity: low
    summary: "No UI, no host notification adapter, no recurring rules yet."
    status: OPEN
