schema_version: "1.0.0"
project:
  id: app-kit
  name: App Kit
  kind: application
  domain: apps
  description: >-
    Shared, dependency-free primitives for the Aetherius OS application slices: ledger, money, search, accounts, permissions, content, workflow and entitlements.
  repository: false
  languages: [typescript]
toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
commands:
  - name: test
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
dependencies:
  projects: [aetherius-os, app-kit]
  external: []

status:
  state: TESTED
  last_verified: "2026-11-07"
  summary: "Working shared library: 8 tests cover the append-only ledger, integer money, ranked search, accounts, default-deny permissions, content workflow and entitlements."
  evidence:
    - "2026-11-07: npm run test:apps -> tests pass; tsc -p apps/tsconfig.json --noEmit passes"
