schema_version: "1.0.0"
project:
  id: aetherius-recorder
  name: Aetherius Recorder
  kind: application
  domain: apps
  description: Domain core for Recorder.
  repository: false
  languages: [typescript]
toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
commands:
  - name: test
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
  - name: verify
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
dependencies:
  projects: [aetherius-os, app-kit]
  external: []
status:
  state: TESTED
  last_verified: "2026-11-03"
  summary: "Functional audio recorder with session state machine, pause/resume, WAV export with validation, and permission/consent checks."
  evidence:
    - "2026-11-03: node --test tests/*.test.ts -> 9/9 pass"
    - "2026-11-03: verify-recorder.js confirms session lifecycle, pause/resume, WAV validation, persistence"
known_issues:
  - id: aetherius-recorder-001
    severity: medium
    summary: "No native GUI, host audio capture adapter, or real microphone integration."
    status: OPEN
