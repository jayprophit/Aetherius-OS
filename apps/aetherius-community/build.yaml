# =============================================================================
# BUILD MANIFEST - Aetherius OS Community
# =============================================================================
# Authoritative record of how this project is built, tested and verified, and
# of what is still broken. Read by Aetherius-OS's build manifest registry
# (docs/BUILD-MANIFEST-REGISTRY.yaml) and validated by
# src/programme/buildManifest.ts.
# =============================================================================
schema_version: "1.0.0"

project:
  id: aetherius-community
  name: Aetherius OS Community
  kind: application
  domain: community
  description: >-
    The Aetherius OS Community application: the feed, the groups, the chat and the events. An integrated application domain of the one Aetherius ecosystem, not a platform of its own.
  repository: false
  languages: [typescript]

toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
      purpose: runs the TypeScript sources directly via type stripping; there is no build step
    - name: typescript
      version: "~5.8.2"
      required: false
      purpose: typecheck only, provided by the Aetherius-OS root devDependencies

commands:
  - name: test
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
  - name: typecheck
    command: npx tsc -p ../tsconfig.json --noEmit
    working_directory: .
    timeout_minutes: 10
  - name: verify
    command: node --test "tests/*.test.ts" && npx tsc -p ../tsconfig.json --noEmit
    working_directory: .
    timeout_minutes: 10
    requires: [test, typecheck]

dependencies:
  projects: [aetherius-os, agent-bridge, genesis]
  external: []

status:
  state: PARTIAL
  last_verified: "2026-10-25"
  summary: >-
    The community domain slice is built and tested: public and private groups,
    invitations, membership, a feed, comments with notifications, events with
    capacity, reports and moderator resolution with an audit trail. Chat is
    not built here because messaging is the Agent-Bridge primitive, and the
    slice is not yet mounted in the Aetherius OS host UI.
  evidence:
    - "2026-10-25: node --test \"tests/*.test.ts\" -> 10 tests passed."
    - "2026-10-25: npx tsc -p apps/tsconfig.json --noEmit -> exit 0 (all four app slices)."
    - "2026-10-25: node apps/verify.mjs -> 4/4 slices passed."
    - "The service uses the shared app-kit accounts, notifications and hash-chained ledger."

known_issues:
  - id: AETHERIUS-COMMUNITY-001
    severity: medium
    summary: >-
      The domain slice is built and listed in the host application registry,
      but chat and the UI are not.
    evidence: >-
      apps/aetherius-community implements groups, feed, comments, events and
      moderation only; it deliberately does not implement messaging, which
      docs/APPLICATION-SHARED-PRIMITIVES.yaml assigns to Agent-Bridge. The
      application is listed in src/apps/registry.ts, but no UI is mounted.
    status: OPEN
    todo_ref: TODO-APP-005

notes:
  - >-
    Named as a first-party application in the Figma handoff of 17 October 2026. The shared primitives are in docs/APPLICATION-SHARED-PRIMITIVES.yaml: the accounts, groups, messaging, permissions and moderation are the ones the rest of Aetherius uses, and the decentralised messaging project is the reference for the messaging primitive rather than a second implementation of it.
  - >-
    The Figma handoff's screen family table lists Community with the feed, groups, chat and events, and the account, message, post and moderation primitives.
  - >-
    A real financial transaction is not performed and a paid service is not provisioned
    without the owner's approval.
