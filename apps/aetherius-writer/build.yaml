schema_version: "1.0.0"
project:
  id: aetherius-writer
  name: Aetherius ${app#aetherius-}
  kind: application
  domain: apps
  description: Domain core for ${app#aetherius-}.
  repository: false
  languages: [typescript]
toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
commands:
  - name: test
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
  - name: verify
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
dependencies:
  projects: [aetherius-os, app-kit]
  external: []
status:
  state: TESTED
  last_verified: "2026-11-02"
  summary: "Functional document editor with persistence, revision tracking, and Markdown/HTML/JSON export."
  evidence:
    - "2026-10-30: node --test tests/*.test.ts -> tests pass"
    - "2026-11-02: 8/8 behavioural tests pass; verify-writer.js confirms create/edit/save/reopen/export"
known_issues:
  - id: ${app#aetherius-}-001
    severity: medium
    summary: "No native GUI or host filesystem adapter."
    status: OPEN
