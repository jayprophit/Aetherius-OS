# =============================================================================
# BUILD MANIFEST - On-Screen Keyboard
# =============================================================================
schema_version: "1.0.0"

project:
  id: on-screen-keyboard
  name: On-Screen Keyboard
  kind: application
  domain: apps
  description: >-
    Aetherius on-screen keyboard with layouts, themes, prediction and accessibility modes.
  repository: false
  languages: [typescript]

toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
      purpose: runs the TypeScript sources directly via type stripping

commands:
  - name: test
    import: tests/*.test.ts
  - name: typecheck
    import: src/**/*.ts

status:
  state: TESTED
  last_verified: "2026-11-07"
  summary: "Real domain core: layouts, themes, typing input and dictionary prediction. 4 behaviour tests + scaffold import test pass."
  evidence:
    - "2026-11-07: npm test (slice) -> behaviour tests pass"
known_issues:
  - id: on-screen-keyboard-001
    severity: medium
    summary: "No UI or host adapter yet; domain logic only."
    status: OPEN
