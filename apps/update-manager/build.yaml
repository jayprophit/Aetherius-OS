schema_version: "1.0.0"
project:
  id: update-manager
  name: Update Manager
  kind: application
  domain: apps
  description: >-
    Release channels (dev/beta/stable), update plans with delta preference,
    signed-release enforcement and rollback to the previous version. Every
    apply and rollback is ledger-audited.
  repository: false
  languages: [typescript]
toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
commands:
  - name: test
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
  - name: verify
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
dependencies:
  projects: [aetherius-os, app-kit]
  external: []
status:
  state: TESTED
  last_verified: "2026-11-07"
  summary: "Real domain core: channel planning with delta preference, signed-release enforcement for stable/beta, install/apply/rollback. 6 behaviour tests + scaffold import test pass."
  evidence:
    - "2026-11-07: npm test (slice) -> 7/7 pass"
    - "2026-11-07: tsc -p apps/tsconfig.json --noEmit passes"
known_issues:
  - id: update-manager-001
    severity: low
    summary: "No download executor or host installer; plans are computed, not applied to the OS."
    status: OPEN
