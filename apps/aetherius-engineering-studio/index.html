<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetherius Engineering Design Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0d0d1a; color: #e0e0e0;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    .engineering-studio {
      display: flex; flex-direction: column; height: 100vh; width: 100vw;
      overflow: hidden; background: linear-gradient(180deg, #0d0d1a 0%, #1a1a2e 100%);
    }
    .toolbar {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: rgba(26,26,46,0.95); border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0; z-index: 100;
    }
    .studio-body {
      display: flex; flex: 1; overflow: hidden; position: relative;
    }
    .viewport { flex: 1; position: relative; background: #1a1a2e; overflow: hidden; }
    .left-panel, .right-panel, .bottom-panel {
      display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-resize-handle { height: 6px; background: rgba(255,255,255,0.1); cursor: row-resize; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
