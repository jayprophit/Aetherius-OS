# =============================================================================
# BUILD MANIFEST - Aetherius OS Learning
# =============================================================================
# Authoritative record of how this project is built, tested and verified, and
# of what is still broken. Read by Aetherius-OS's build manifest registry
# (docs/BUILD-MANIFEST-REGISTRY.yaml) and validated by
# src/programme/buildManifest.ts.
# =============================================================================
schema_version: "1.0.0"

project:
  id: aetherius-learning
  name: Aetherius OS Learning
  kind: application
  domain: learning
  description: >-
    The Aetherius OS Learning application: the learner and educator views, the courses and lessons, the assessment, and the groups. An integrated application domain of the one Aetherius ecosystem, not a platform of its own.
  repository: false
  languages: [typescript]

toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
      purpose: runs the TypeScript sources directly via type stripping; there is no build step
    - name: typescript
      version: "~5.8.2"
      required: false
      purpose: typecheck only, provided by the Aetherius-OS root devDependencies

commands:
  - name: test
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
  - name: typecheck
    command: npx tsc -p ../tsconfig.json --noEmit
    working_directory: .
    timeout_minutes: 10
  - name: verify
    command: node --test "tests/*.test.ts" && npx tsc -p ../tsconfig.json --noEmit
    working_directory: .
    timeout_minutes: 10
    requires: [test, typecheck]

dependencies:
  projects: [aetherius-os, agent-bridge, genesis]
  external: []

status:
  state: PARTIAL
  last_verified: "2026-10-25"
  summary: >-
    The learning domain slice is built and tested: courses, ordered lessons,
    enrolment, prerequisite enforcement, quizzes with pass marks, assignments
    and grading, progress and completion. It is not yet mounted in the
    Aetherius OS host UI, and authoring is an API rather than an editor.
  evidence:
    - "2026-10-25: node --test \"tests/*.test.ts\" -> 6 tests passed."
    - "2026-10-25: npx tsc -p apps/tsconfig.json --noEmit -> exit 0 (all four app slices)."
    - "2026-10-25: node apps/verify.mjs -> 4/4 slices passed."
    - "The service uses the shared app-kit accounts, entitlements and hash-chained ledger."

known_issues:
  - id: AETHERIUS-LEARNING-001
    severity: medium
    summary: >-
      The domain slice is built and listed in the host application registry,
      but the learner and educator UI and a content authoring editor are not.
    evidence: >-
      The service and its tests live in apps/aetherius-learning and
      src/apps/registry.ts lists the application; the learner and educator views
      are not built, and courses are created through the service API with no
      editor.
    status: OPEN
    todo_ref: TODO-APP-004

notes:
  - >-
    Named as a first-party application in the Figma handoff of 17 October 2026, with the concepts taken from the LearnDash LMS archive. The shared primitives are in docs/APPLICATION-SHARED-PRIMITIVES.yaml. The handoff is explicit that Commerce and Learning share their data model, so the enrolment, entitlement and payment mechanisms are one set and not two.
  - >-
    The Figma handoff's V2 inputs table gives the destination as Aetherius OS Learning, with the LearnDash LMS 4.5.0.3 as the concept source. It is third-party and is referenced, not copied.
  - >-
    A real financial transaction is not performed and a paid service is not provisioned
    without the owner's approval.
