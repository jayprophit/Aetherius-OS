# =============================================================================
# BUILD MANIFEST - PDF
# =============================================================================
schema_version: "1.0.0"

project:
  id: aetherius-pdf
  name: PDF
  kind: application
  domain: apps
  description: >-
    Aetherius PDF viewer with annotations, form fill, search and digital signatures.
  repository: false
  languages: [typescript]

toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
      purpose: runs the TypeScript sources directly via type stripping

commands:
  - name: test
    import: tests/*.test.ts
  - name: typecheck
    import: src/**/*.ts

status:
  state: TESTED
  last_verified: "2026-11-07"
  summary: "Real domain core: document registry, page annotations and form fields. 4 behaviour tests + scaffold import test pass."
  evidence:
    - "2026-11-07: npm test (slice) -> behaviour tests pass"
known_issues:
  - id: pdf-001
    severity: medium
    summary: "No UI or host adapter yet; domain logic only."
    status: OPEN
