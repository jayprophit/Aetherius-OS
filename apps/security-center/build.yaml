schema_version: "1.0.0"
project:
  id: security-center
  name: Security Center
  kind: application
  domain: apps
  description: >-
    Host-facing security surface: firewall rules, per-application permissions,
    a hash-chained audit log, quarantine and an overall posture score. Local
    state only; no network scanning happens in this layer.
  repository: false
  languages: [typescript]
toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
commands:
  - name: test
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
  - name: verify
    command: node --test "tests/*.test.ts"
    working_directory: .
    timeout_minutes: 5
dependencies:
  projects: [aetherius-os, app-kit]
  external: []
status:
  state: TESTED
  last_verified: "2026-11-07"
  summary: "Real domain core: firewall rules with per-app resolution, permissions, verifiable hash-chained audit log, quarantine lifecycle and posture score. 5 behaviour tests + scaffold import test pass."
  evidence:
    - "2026-11-07: npm test (slice) -> 6/6 pass"
    - "2026-11-07: tsc -p apps/tsconfig.json --noEmit passes"
known_issues:
  - id: security-center-001
    severity: low
    summary: "No host adapter; does not apply rules to the real OS firewall."
    status: OPEN
