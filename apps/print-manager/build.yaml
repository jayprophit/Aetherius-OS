# =============================================================================
# BUILD MANIFEST - Print Manager
# =============================================================================
schema_version: "1.0.0"

project:
  id: print-manager
  name: Print Manager
  kind: application
  domain: apps
  description: >-
    Aetherius print manager with queues, drivers, preview, duplex and scan-to-cloud.
  repository: false
  languages: [typescript]

toolchain:
  build_system: node --test
  package_manager: none
  requirements:
    - name: node
      version: ">=24"
      required: true
      purpose: runs the TypeScript sources directly via type stripping

commands:
  - name: test
    import: tests/*.test.ts
  - name: typecheck
    import: src/**/*.ts

status:
  state: TESTED
  last_verified: "2026-11-07"
  summary: "Real domain core: printers, queues and job lifecycle. 3 behaviour tests + scaffold import test pass."
  evidence:
    - "2026-11-07: npm test (slice) -> behaviour tests pass"
known_issues:
  - id: print-manager-001
    severity: medium
    summary: "No UI or host adapter yet; domain logic only."
    status: OPEN
