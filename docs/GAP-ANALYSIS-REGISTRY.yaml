- id: GAP-AUTH-001
  name: Capability-scoped authority
  axis: permissions_authority
  status: VERIFIED
  gap: 'The authority engine now evaluates a grant: default deny, one capability per grant, only the listed
    actions, and an expired grant refused. What was still missing was the binding of that engine to the
    tool execution path, so a tool call did not consult it before it ran. That binding is now in place:
    the tool executor asks the authority engine and obeys the answer, so a call without a live grant for
    the tool, or with a grant that does not permit the action, is refused and recorded.'
  present: 'genesis/agents/authority.hpp and src/agents/authority.cpp implement the evaluation: AuthorityRegistry,
    CapabilityRequest, AuthorityGrant, and a decision for every outcome. A delegated grant can only narrow:
    it may not hold a capability the parent lacks, an action the parent does not permit, a broader network
    or filesystem permission, or a longer lifetime. tests/authority_tests.cpp covers thirty cases including
    the delegation chain, and REQ-POL-001 moves from specified to unit tested. The tool executor binds
    it: the executor does not restate the rule, it asks the authority engine for the grant and obeys the
    answer, and a missing grant is refused before the tool runs. The hive binds it too: a delegated grant
    is narrowed against the parent''s grant rather than accepted as given.'
