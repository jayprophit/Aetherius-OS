- id: GAP-HIVE-001
  name: Delegation with narrowing scope
  axis: multi_agent
  status: VERIFIED
  gap: A delegation primitive that issues a scoped grant to a child agent, checks that the child cannot
    widen it, and proves it.
  present: 'The hive issues a child a scope that is within its parent''s, through the authority engine,
    so the rule that a delegated grant may only narrow is the rule that already governs grants rather
    than a second one. A child cannot hold a capability, an action, a network or filesystem permission,
    or a lifetime that its parent lacks, and a chain of delegations can only subtract: the second level
    of a chain cannot reach the first level''s wider scope. The tests prove each of those.'
  priority: 1
