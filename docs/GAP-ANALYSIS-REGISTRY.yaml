- id: GAP-HIVE-002
  name: Hive communication and messaging
  axis: multi_agent
  status: VERIFIED
  gap: A message type, a transport, and a record of who said what to whom.
  present: 'The hive carries a typed message between agents, with a sender, a recipient, the capability
    the message exercises and the action within it. A message is authorised before it is sent: the sender
    must hold a live grant permitting the action, and a message from an agent that holds nothing, or that
    exercises an action its grant does not permit, is refused and is neither delivered nor recorded. Messages
    are delivered in order, a broadcast reaches every agent but the sender, and the hive keeps the record
    of what was said.'
  priority: 1
