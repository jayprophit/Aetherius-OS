- id: GAP-PLAN-001
  name: Task decomposition and planning
  axis: planning
  status: VERIFIED
  gap: Workflows are flat ordered steps with one tool call each. There is no decomposition, no dependency
    graph, no re-planning when a step fails, and the organism loop is missing its plan stage entirely.
  present: 'The planner turns an objective into a plan whose steps carry their dependencies, so the steps
    that may run now are computed rather than guessed. A plan that cannot be executed is refused: a dependency
    on a step that does not exist, a dependency on itself and a dependency cycle are all refused, because
    a plan that waits for ever is worse than no plan. When a step fails, the steps that depended on it
    are held and the objective is decomposed again with the reason, so the work continues rather than
    restarting. The organism loop borrows the planner and records the plan it produced, so its plan stage
    is executed rather than marked missing'
  priority: 1
  requirement_refs:
  - REQ-DEV-001
  - REQ-COG-PREDICT-001
  - REQ-ORGAN-001
  - REQ-PLAN-DECOMPOSE-001
