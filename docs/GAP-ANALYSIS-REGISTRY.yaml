- id: GAP-LIFE-001
  name: Crash recovery and checkpoint resume
  axis: lifecycle_recovery
  status: VERIFIED
  gap: A crash that loses the work, with no checkpoint, no idempotency key and no recovery.
  present: A crash does not lose the work. A task whose worker dies has its lease expire, and an expired
    lease is recoverable, so the task is picked up again. Resuming it keeps the checkpoint, so the work
    continues from where it stopped rather than from the beginning, and the attempt count says how many
    times it has been tried. The idempotency key means the resumed task is not submitted as new work.
