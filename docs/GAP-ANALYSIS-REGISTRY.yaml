- id: GAP-PLAN-002
  name: Durable task state, checkpoints and resume
  axis: planning
  status: VERIFIED
  gap: A durable task registry, with a checkpoint, a lease and a resume, so a job can survive a restart
    or a crash.
  present: The durable task registry records work that outlives the process. Every task carries an idempotency
    key, so submitting the same work twice returns the same task and the work is done once. A worker holds
    a bounded lease, so a second worker cannot take a task that is still live, and a worker that dies
    does not hold it for ever. A checkpoint records the progress, opaque to the registry, which stores
    it and hands it back without pretending to understand it. The record carries a checksum, so a tampered
    one is refused rather than mistaken for an empty registry, which would silently forget every task
    that was owed.
  priority: 1
  requirement_refs:
  - REQ-PROV-001
  - REQ-LIFE-RECORD-001
  - REQ-RUN-001
  - REQ-TASK-DURABLE-001
