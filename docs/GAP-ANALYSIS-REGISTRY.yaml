- id: GAP-MODEL-002
  name: Free-first admission and zero-spend guard
  axis: model_integration
  status: VERIFIED
  gap: Nothing refuses a paid or unknown endpoint. The policy is described in the handoff and enforced
    nowhere in the kernel or the runtime.
  present: 'The admission gate decides what may be called and what may be spent. An endpoint whose cost
    is not known is refused, because a guard that admits what it does not understand is not a guard. A
    free or local endpoint is admitted without question, and it is the preferred answer for everything.
    A metered endpoint spends its free allowance before any money is involved. Money is refused unless
    it is budgeted: spending is off by default, and a caller that turns it on must state how many paid
    uses are permitted, which the gate enforces as a ceiling rather than an intention. The spend is zero
    until a paid endpoint is admitted and the budget allows it'
  priority: 1
  requirement_refs:
  - REQ-POL-001
  - REQ-PLATFORM-SERVICES-001
  - REQ-ADMISSION-FREE-001
