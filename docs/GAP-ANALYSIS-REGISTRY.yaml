- id: GAP-CHAIN-001
  name: Genesis has a way to be reached from outside
  axis: interface_presence
  status: VERIFIED
  gap: 'Genesis had no way to be reached from outside. The organism is a C++ kernel carrying identity,
    memory, state and the causal runtime, and it was built, tested and never run by anything: the interface
    reached the Bridge, the Bridge reached the models, and nothing in between was Genesis. The Bridge''s
    own ''Genesis runtime'' was a Python store of session and identity references, which is a different
    thing under the same name. So the organism was not in the chain, and the inheritance document''s third
    step, Genesis proven through the interface and the Bridge, could not be met.'
  present: 'The kernel''s runtime host is the way in: a one-shot command that boots an organism, applies
    one event to it, checkpoints it and reports its state, with the durable state on disk between calls.
    The host''s own self-test boots an organism, records an event, checkpoints it, restarts and rolls
    back. The Bridge now attaches the host, boots the organism at startup, records a session and a task
    as the organism''s events, and publishes the organism''s identity, version and state in the runtime
    snapshot the interface reads. The organism''s identity comes from its namespace and key and never
    from the model route, so replacing the model does not replace the organism, and the identity survives
    a restart. A Bridge with no kernel attached still runs every task and says the organism is not attached.
    Verified live: a local model wrote a haiku through the Bridge and the organism''s memory holds the
    boot and both events, its version advancing from v1 to v3.'
  priority: 1
  requirement_refs:
  - REQ-RUN-001
  - REQ-EVT-001
  - REQ-ENTITY-ADDRESS-001
  - REQ-MEM-001
  implementation_refs:
  - src/runtime/runtime.cpp
  - src/identity/entity_registry.cpp
  - src/memory/graph.cpp
  test_refs:
  - tests/runtime_tests.cpp
  - tests/identity_tests.cpp
  - tests/memory_cognition_tests.cpp
  acceptance_refs: []
  gap_register_refs: []
  platform_refs: []
  evidence: 'The host is in the Genesis tree at tools/genesis_runtime_host.cpp and carries its own self-test,
    which the Bridge runs before it attaches: a host that cannot boot an organism, record an event, checkpoint,
    restart and roll back is not attached. The organism''s identity is derived from its namespace and
    key, and the identity registry and the memory graph are persisted between calls, so the same organism
    is there after a restart. The Bridge''s half is covered by twenty-three tests in Agent-Bridge/tests/test_genesis_kernel.py,
    seven of which run against the real kernel when it has been built and are skipped loudly when it has
    not, and by eleven in Agent-Bridge/tests/test_genesis_seam.py. Run live: the organism''s manifest
    advanced from v1 to v3, its sequence advanced, and its memory digest changed, with the boot and both
    events in the memory graph.'
  provenance: gap analysis 2026-10-21, from running the stack and reading the kernel's own output
