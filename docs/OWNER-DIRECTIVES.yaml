  title: Genesis is the AI agent, a living systemic organism
  text: Genesis is the AI agent. It is a living, systemic organism. It is part of Aetherius OS at the
    kernel level, it is an agent you can download and use, and it is part of the IDE.
  source_thread: owner instruction, 2026-10-20
  projects:
  - genesis
  - aetherius-os
  - ide-workspace
  satisfied_by:
  - docs/BUILD-MANIFEST-REGISTRY.yaml
  - TODO-STR-001
- id: RULE-15
  title: Agent-Bridge is shared, downloadable, and heading into the ecosystem
  text: Agent-Bridge is used by Genesis, Aetherius OS and the IDE, and it is available for users to download
    and use with their own agents. Eventually it will be part of the Aetherius OS ecosystem, to help Genesis
    run everything down to the kernel level, as Genesis is built at the kernel level with Aetherius.
  source_thread: owner instruction, 2026-10-20
  projects:
  - agent-bridge
  - genesis
  - aetherius-os
  - ide-workspace
  satisfied_by:
  - docs/BUILD-MANIFEST-REGISTRY.yaml
  - TODO-STR-002
- id: RULE-16
  title: The IDE is an app of Aetherius OS that also runs elsewhere
  text: The IDE is an app for Aetherius OS, and it may also be used by other operating systems.
  source_thread: owner instruction, 2026-10-20
  projects:
  - ide-workspace
  - aetherius-os
  satisfied_by:
  - docs/BUILD-MANIFEST-REGISTRY.yaml
  - TODO-STR-003
- id: RULE-17
  title: MAT is the periodic table the programme processes data with
  text: 'MAT is my own periodic table. Genesis, Aetherius OS, Agent-Bridge and the other AI agents and
    subagents will use it to process data, based on data about materials, processes, principles and the
    rest. It is not finished: it is still being worked on by the Codex desktop app, on a scheduled five-hour
    window, and the work is pending.'
  source_thread: owner instruction, 2026-10-20
  projects:
  - mat
  - genesis
  - aetherius-os
  - agent-bridge
  satisfied_by:
  - docs/BUILD-MANIFEST-REGISTRY.yaml
  - TODO-STR-004
- id: RULE-18
  title: Temp is the holding place, and it is needed
  text: Temp is a folder used just in case any files, data or folders need to be saved outside their project.
    It is a temporary holding place until it is needed, or fully decided, or what happens next is decided.
  source_thread: owner instruction, 2026-10-20
  projects:
  - aetherius-os
  satisfied_by:
  - docs/workspace-hygiene.test.ts
  - Temp/WORKSPACE-RESTRUCTURE-2026-10-20.md
- id: RULE-19
  title: Old failed predecessors are absorbed, and their repositories removed
  text: Old failed predecessors will be absorbed by the new fully working project, and the obsolete repositories
    will be removed. They are archived rather than deleted, because deleting cannot be undone and the
    absorption has not been verified for each one yet.
  source_thread: owner instruction, 2026-10-20
  projects:
  - aetherius-os
  - genesis
  satisfied_by:
  - TODO-STR-005
  - Temp/WORKSPACE-RESTRUCTURE-2026-10-20.md
- id: RULE-20
  title: The material is enough to finish the projects
  text: All the data provided, plus the repositories, plus access to the internet, plus all the chat conversations,
    should be enough to finish multiple projects, old, current and new. The conversations explain the
    apps, the plugins, the functions, the features and the mechanisms. Everything is to be added to the
    todos list and recorded in the correct YAML files.
  source_thread: owner instruction, 2026-10-20
  projects:
  - aetherius-os
  satisfied_by:
  - docs/PROGRAMME-CATALOGUE.yaml
  - docs/PROGRAMME-GAP-ANALYSIS.yaml
  - docs/PROJECT-TODOS.yaml
  - research/conversations/project-conversations.md
- id: RULE-21
  title: 'The endgame: production architecture, and the removal of what is obsolete'
  text: Once all projects are fully finished and built ready for public release, the programme is to be
    given senior level, world class, industrial industry level production and system architecture. The
    obsolete files, folders and data are removed, remembering to keep reference data so it can be used
    later if needed.
  source_thread: owner instruction, 2026-10-20
