standing_rules:
- id: RULE-01
  title: Inspect before editing, and report exactly what changed
  text: Before editing, identify the repository root and current architecture; after editing, run relevant
    tests/lint/build if available, report exactly what changed.
  source_thread: 01a06def
  projects:
  - aetherius-os
  - genesis
  - mat
  - poietek
  - universal-bridge
  satisfied_by:
  - Every build manifest records the exact command and its observed result
  - Every build in this session was verified by running it
- id: RULE-02
  title: Never copy an old implementation into Genesis without checking its licence
  text: Never blindly copy an old implementation into Genesis. Check licensing and provenance.
  source_thread: 01a05e27
  projects:
  - genesis
  - aetherius-os
  satisfied_by:
  - 'TODO-GEN-006: 47 files of unlicensed OmniAgent source untracked from Genesis'
  - 'TODO-SEC-001: the secret scan is a build gate'
  notes: This is why the REA work is a comparison against reference implementations rather than a copy
    of one.
- id: RULE-03
  title: A chat claim is a candidate input, never proof
  text: Deduplicate against canonical requirements, claims, sources, experiments and scientific owners;
    original chat claims are candidate inputs, never proof of implementation or established science.
  source_thread: 01a0ed79
  projects:
  - mat
  - genesis
  satisfied_by:
  - 'The evidence vocabulary: PROPOSED, FOUND, IMPLEMENTED, TESTED, INTEGRATED, DEPLOYED, INDEPENDENTLY_VERIFIED,
    NOT_LOCATED, BLOCKED'
- id: RULE-04
  title: Say UNKNOWN rather than fabricate
  text: Explicitly use UNKNOWN / NOT APPLICABLE / INSUFFICIENT DATA instead of fabricating.
  source_thread: 01a0a0f2
  projects:
  - mat
  satisfied_by:
  - MAT-TODO-008 and the MAT data semantics are already implemented and tested
- id: RULE-05
  title: Do not create a second registry or a nested repository
  text: Do not create another requirements registry or rebuild completed work. Do not create a second
    repo or nested .git.
  source_thread: 01a0ed79
  projects:
  - aetherius-os
  - genesis
  - mat
  satisfied_by:
  - The build manifest registry indexes the existing project manifests; it does not replace them
  - The REA adapter reuses the existing ingest, invention and evidence modules rather than adding a parallel
    store
- id: RULE-06
  title: Verify before deleting
  text: Before deleting anything, verify the data exists in the master repo and is recoverable from git
    history/commit.
  source_thread: 01a0a0f2
  projects:
  - mat
  - aetherius-os
  satisfied_by:
  - The two gigabyte artefact untracking kept every file on disk and only removed the tracking
- id: RULE-07
  title: The local path is the working copy; GitHub is the source it commits back to
  text: The local desktop path is the working copy; the GitHub repo is the version-controlled source it
    should commit/push back to.
  source_thread: 01a07cc2
  projects:
  - aetherius-os
  - genesis
  - agent-bridge
  - ide-workspace
  - poietek
  - mat
  - universal-bridge
  satisfied_by:
  - All seven repositories pushed and in sync on 2026-10-20
- id: RULE-08
  title: Keep the repositories public
  text: Keep the repository public for now because the user wants AI tools to be able to read it.
  source_thread: 01a044ea
  projects:
  - aetherius-os
  - genesis
  - agent-bridge
  - ide-workspace
  - poietek
  - mat
  - universal-bridge
  satisfied_by:
  - The credential redaction before extraction, so the public repositories carry no secrets
- id: RULE-09
  title: Distinguish what is implemented from what is scaffolding
  text: Clearly distinguish implemented functionality from scaffolding/experimental functionality and
    do not claim unsupported device/DAW integrations are complete.
  source_thread: 01a044ea
  projects:
  - universal-bridge
  - genesis
  - aetherius-os
  satisfied_by:
  - The build manifest states a status per project with the evidence that produced it
  - The gap analysis records IMPLEMENTED as distinct from VERIFIED
- id: RULE-10
  title: Do not scatter build artifacts across the desktop
  text: Temporary external files may use the designated temporary directory, but do not scatter permanent
    build artifacts across the desktop.
  source_thread: 01a0ed79
  projects:
  - aetherius-os
  satisfied_by:
  - The workspace hygiene guard, and the two stray root documents moved to their owning projects
- id: RULE-11
  title: Track every section of the build as a percentage
  text: Make sure to track every section of the build using a percentage out of 100 percent.
  source_thread: 01a05e27
  projects:
  - genesis
  satisfied_by:
  - The Genesis completion report records a percentage per component
  notes: The gap analysis deliberately reports readiness as a COVERAGE measure and says so, rather than
    presenting a percentage that could be read as a quality judgement.
- id: RULE-12
  title: Do not mass-generate images yet
  text: Do not mass-generate AI images yet.
  source_thread: 01a07cc2
  projects:
  - mat
  satisfied_by:
  - MAT's image and panel work stays bounded until the data is ready
- id: RULE-13
  title: Every project sits inside the project that owns it
  text: crossplatform, football-card-game, athena, aetherial-platform, the decentralized messaging app,
    the Food Wiki, hermes-config-audit, aetherial, the IDE, LedgerLands, niche_platform, Poietek, quantum-os,
    self-building-ai, universal-bridge, the virtual assistant and web-platform are all part of Aetherius
    OS, and each one has been dissolved into the folder of the project that owns it.
  source_thread: owner instruction, 2026-10-20
  projects:
  - aetherius-os
  satisfied_by:
  - docs/BUILD-MANIFEST-REGISTRY.yaml
  - docs/PROGRAMME-CATALOGUE.yaml
  - Temp/WORKSPACE-RESTRUCTURE-2026-10-20.md
