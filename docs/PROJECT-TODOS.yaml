- id: TODO-GAP-002
  title: 'Close the hive gaps: delegation with narrowing scope, and hive messaging'
  project: aetherius-os
  status: DONE
  priority: 1
  source:
    kind: gap-analysis
    ref: GAP-ANALYSIS-REGISTRY.yaml, platform_inventory
  detail: 'The hive is the delegation and messaging layer of the agent platform. Delegation may only narrow:
    a parent hands a child a scope that is within its own, through the authority engine, so there is one
    rule about grants rather than two, and a chain of delegations can only subtract. A message is authorised
    before it is sent: the sender must hold a live grant permitting the action the message exercises,
    and a message from an agent that holds nothing is refused and is neither delivered nor recorded.'
  evidence: Genesis includes/genesis/agents/hive.hpp and src/agents/hive.cpp, with tests/hive_tests.cpp
    proving it in sixty-two checks that run in the build gate. The gap analysis records GAP-HIVE-001 and
    GAP-HIVE-002 as VERIFIED and cites the hive. The whole Genesis suite passes, twenty-four of twenty-four.
  acceptance:
  - GAP-HIVE-001 is VERIFIED and cites the hive
  - GAP-HIVE-002 is VERIFIED and cites the hive
  - The hive's tests run in the Genesis build gate
  resolution: 'Resolved 2026-10-20. The hive closes both hive gaps: delegation with narrowing scope, and
    hive communication and messaging. Sixty-two checks in tests/hive_tests.cpp prove the rules, and the
    whole Genesis suite passes.'
- id: TODO-GAP-003
  title: Close the durable task state and crash recovery gaps
  project: aetherius-os
  status: DONE
  priority: 1
  source:
    kind: gap-analysis
    ref: Aetherius-OS/docs/GAP-ANALYSIS-REGISTRY.yaml
  detail: The durable task registry is the work that survives a restart. An idempotency key makes a submission
    idempotent, so a retry after a network failure cannot do the work twice. A bounded lease gives one
    worker the task, so a second worker cannot take it while it is live and a worker that dies does not
    hold it for ever. A checkpoint records the progress, opaque to the registry, which stores it and hands
    it back without pretending to understand it. A task whose lease has expired is recoverable, and resuming
    it keeps the checkpoint, so the work continues from where it stopped rather than from the beginning.
  evidence: Genesis includes/genesis/agents/tasks.hpp and src/agents/tasks.cpp, with tests/task_tests.cpp
    proving it in a hundred and thirty-four checks that run in the build gate, including the whole crash
    end to end. The requirement registry carries REQ-TASK-DURABLE-001, and the gap analysis records GAP-PLAN-002
    and GAP-LIFE-001 as VERIFIED and cites the registry. The whole Genesis suite passes, twenty-five of
    twenty-five.
  acceptance:
  - Every gap maps to a capability node or is recorded as genuinely outside the registry
  - A test proves the two registries do not contradict each other
  resolution: Resolved 2026-10-20. The durable task registry closes both task gaps. A hundred and thirty-four
    checks in tests/task_tests.cpp prove it, and the whole Genesis suite passes.
