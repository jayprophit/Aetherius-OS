    left as a competing standalone project.
  resolution: Resolved 2026-10-20. The five sibling project folders were added to KNOWN_PROJECTS, and
    the REA research tree was moved to Aetherius-OS/research/rea with the adapter at Aetherius-OS/src/analysis/rea,
    so no new project folder was needed. docs/workspace-hygiene.test.ts now passes 13 of 13.
  acceptance:
  - The KNOWN_PROJECTS list matches the folders on disk
  - docs/workspace-hygiene.test.ts passes
  blocks:
  - TODO-WS-002
- id: TODO-AOS-003
  title: Make the HTTP bridge transport test deterministic
  project: aetherius-os
  status: DONE
  priority: 1
  source:
    kind: build-audit
    ref: npm test, 2026-10-20
  detail: 'Three tests were timing-sensitive under CPU contention on this four-core host: the bridge transport
    test, the shared schema envelope test and the capability registry audit. Each passed when its own
    file was run alone. The cause was the suite running one worker per test file, which put a hundred
    workers on four cores.'
  evidence: src/workflows/bridgeAction.test.ts:339 -> Test timed out in 5000ms. src/state/sharedSchemas.test.ts
    -> failed in a full-suite run. src/programme/capabilityRegistry.test.ts "has no structural integrity
    errors" -> failed in a full-suite run. The suite reported "100 workers spawned" on a four-core machine.
  resolution: Resolved 2026-10-20. The Vitest pool is limited to eight forks and the timeouts are raised
    only enough to cover the slowest real operation, the registry audit that walks the whole programme.
    Two consecutive full-suite runs after the change each reported 1800 of 1800 passing in 36 and 39 seconds.
    Raising a timeout would have hidden the problem; stopping the machine being oversubscribed fixes it.
  acceptance:
  - The suite passes repeatedly under full parallelism
  - The cause is fixed at the root rather than by raising timeouts
