- id: TODO-GEN-001
  title: Discard the stale CMake cache in the Genesis build tree
  project: genesis
  status: DONE
  resolution: Resolved 2026-10-20. The stale CMakeCache.txt and CMakeFiles were discarded and the tree
    reconfigured at its current path. The build now links 119 of 119 targets and all 22 registered CTest
    gates pass. The repository content manifest was regenerated afterwards, because that guard correctly
    detected the source change rather than letting it through silently.
  priority: 1
  source:
    kind: build-audit
    ref: cmake -S . -B build, 2026-10-20
  detail: build/CMakeCache.txt was generated when the repository lived at C:\Users\jpowe\Desktop\Genesis
    and was moved into the Projects folder afterwards. CMake refuses to reuse a cache whose source or
    binary directory no longer matches, so nothing compiles and nothing is even attempted.
  evidence: 'CMake Error: The source "C:/Users/jpowe/Desktop/Projects/Genesis/CMakeLists.txt" does not
    match the source "C:/Users/jpowe/Desktop/Genesis/CMakeLists.txt" used to generate cache.'
  acceptance:
  - cmake --preset local-release configures without a path-mismatch error
  - cmake --build --preset local-release compiles every target
  - ctest --preset local-release reports the full registered suite
  blocks:
  - TODO-GEN-002
  - TODO-GEN-003
