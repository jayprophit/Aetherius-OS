- id: TODO-LL-001
  title: Remove the baseUrl option that TypeScript 7 deleted
  project: ledgerlands
  status: DONE
  resolution: Resolved 2026-10-20. baseUrl was removed from the shared base config and the path aliases
    were rewritten as explicitly relative paths to the package sources, which is what TypeScript 7 requires.
  priority: 1
  source:
    kind: build-audit
    ref: npm run typecheck, 2026-10-20
  detail: The installed TypeScript is 7.0.2, which removed the baseUrl compiler option outright. The shared
    base config still declares it, so every workspace package that extends it fails to typecheck before
    compiling a single file.
  evidence: 'tsconfig.json(3,3): error TS5090: Non-relative paths are not allowed. Did you forget a leading
    ''./''?  /  tsconfig.json(3,3): error TS5102: Option ''baseUrl'' has been removed. Please remove it
    from your configuration.'
  acceptance:
  - npm run typecheck completes with no TS5090 or TS5102 diagnostics
  - No tsconfig in the workspace sets baseUrl
- id: TODO-LL-002
  title: Give the LedgerLands packages a resolvable build order
  project: ledgerlands
  status: DONE
  resolution: Resolved 2026-10-20 with TypeScript project references. Every package is composite, each
    declares its dependencies as references, a root solution tsconfig.json lists all eight projects, and
    the typecheck scripts use build mode so the compiler enforces the dependency order rather than it
    being a matter of luck. npx tsc -b, npm run typecheck, npm run build and npm test all now exit 0.
  priority: 1
  source:
    kind: build-audit
    ref: tsconfig.base.json paths, 2026-10-20
  detail: Package path aliases point at dist output that has never been produced, so there is no order
    in which the packages can compile against each other. TypeScript project references, or aliases that
    resolve to source, are needed to break the deadlock.
  evidence: tsconfig.base.json maps @ledgerlands/shared-types to packages/shared-types/dist/index.d.ts;
    no dist directory exists under any package.
  depends_on:
  - TODO-LL-001
  acceptance:
  - npm run build produces dist output for every package
  - npm run typecheck passes with no missing-module diagnostics
- id: TODO-WS-001
  title: Register the six unlisted project folders in the workspace hygiene guard
