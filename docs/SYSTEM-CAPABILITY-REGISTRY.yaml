  - id: REQ-p20-change-impact
    name: "Change impact graph over touch sets"
    type: requirement
    description: "Dependency-graph join with transitive impact and history weighting over TouchEstimate inputs; consumes touch.ts, never re-implements estimation."
    domain: aetherius-os
    primary_parent: CAP-aetherius-os-platform
    relationships:
      depends_on: [REQ-p20-expected-touch-set]
    requirement_id: REQ-p20-change-impact
    required: true
    phase: P20
    priority: 1
    status_from_requirement: true
    implementation:
      paths:
        - "Aetherius-OS/src/programme/changeImpact.ts"
    evidence:
      tests:
        - "Aetherius-OS/src/programme/changeImpact.test.ts"
      notes:
        - "classification: RELATED; estimator exact, no graph"
        - "selected by deterministic selector 2026-09-26"
        - "registered scope is a DEPENDENCY-GRAPH JOIN with transitive impact and history weighting over TouchEstimate inputs, consuming touch.ts and never re-implementing estimation"
        - "src/programme/changeImpact.ts: IMPACT_RELATIONS (IMPORTS/RE_EXPORTS/REFERENCES/DECLARED - four precise classes, no speculative edge zoo), buildChangeImpactGraph, queryChangeImpact, DEFAULT_MAX_DEPTH, ImpactProblem"
        - "TOUCH CONSUMED, NEVER RE-ESTIMATED: TouchEstimate is imported as a type and its paths become the changed-path candidates; estimateTouchSet is NOT called, wrapped or reimplemented, and the estimator's own unknown[] and invalid[] are carried into the result so its uncertainty is not silently dropped by the join"
        - "DIRECTION IS EXPLICIT AND TESTED: an edge means 'from imports to', so impact traverses BACKWARDS from a changed path to its importers. A change to b (imported by a) affects a; a change to a does NOT automatically affect b. Both directions are asserted"
        - "NO NAME-SIMILARITY INFERENCE, with a dedicated regression: src/user.ts, src/userService.ts and src/userServiceHelper.ts with NO structural edge produce NO impact relation between them; adding a real declared import produces exactly one; and two files sharing a directory remain unrelated. Filenames, symbol names, prefixes, directories and concept overlap NEVER create an edge"
        - "DIRECT != TRANSITIVE: depth 0 is the changed path, depth 1 is direct, deeper is transitive, with `via` naming the immediate dependency. DIRECT IMPACT != TRANSITIVE IMPACT is preserved and asserted"
        - "CYCLE-SAFE AND BOUNDED: breadth-first traversal with a visited set SEEDED WITH THE CHANGED PATHS, so a cycle routing back to a changed path cannot re-add it. Verified on a real A->B->C->A cycle where every node appears exactly once. maxDepth is explicit and required to be a positive integer (default 12)"
        - "REAL BUGS FOUND AND FIXED: (1) a changed path inside a cycle was added TWICE because the visited set was not seeded with the changed set; (2) the 'record every relation kind' loop looked in the WRONG direction (it inspected who imports the reached node rather than the grouped incoming edges), so a second relation kind to the same node was silently LOST. Fixed by grouping incoming edges per importer per frontier target, so all relation kinds reaching a node are collected"
        - "HISTORY WEIGHTING IS NOT A RISK SCORE: history is optional caller-supplied change counts. Absent history reports historyState UNKNOWN with a null count and null weight - NEVER zero, because zero changes is a measured fact and absent history is not. A path missing from supplied history is also UNKNOWN. Counts require a provenance source and reject negatives. weight exists only so a frequently-changed consumer is not buried, and noVerdict is literal true with no risk/quality/verdict/severity/rating field"
        - "UNKNOWN IMPACT STAYS UNKNOWN: a changed path absent from the graph is reported in unresolved[] with the reason that not-found is NOT proven isolation, and is not listed as impacted. Deleted and renamed paths work because impact NEVER checks current file existence"
        - "PATHS REUSE THE SHARED GUARD: assertSafePath from src/runners/sync.ts is reused, so no second private traversal implementation was added, and a test asserts the shared guard rejects what this module rejects"
        - "EDGES REQUIRE A REASON: every edge carries a provenance reason so a reviewer can answer WHY a path is impacted; opaque 'related' is not emitted. Trivial self-loops are rejected as resolution artifacts, and edges are deduplicated by canonical identity while a genuinely distinct relation type is preserved"
        - "IN-MEMORY AND CALLER-CONSTRUCTED: no store, registry, database, cache, server or service surface, and no export named EvidenceGraph, buildReviewContextPack, compareHarness, estimateTouchSet, TouchEstimateInput or assertSafePath. Graph construction (buildChangeImpactGraph) stays separate from querying (queryChangeImpact)"
        - "33 tests: four-class relation vocabulary, invented relation and missing reason rejected, self-loop rejected, unsafe paths rejected via the shared guard, unknown-key rejection, the name-similarity regression in three parts, shared-directory non-relation, both direction cases, depth/direct/via, direct vs transitive separation, A->B->C->A cycle safety, maxDepth bounding, dedupe preserving distinct relations, all relation kinds recorded, deterministic ordering from scrambled input, identical repeated output, history UNKNOWN vs zero, observed counts with source, path absent from history UNKNOWN, source-required and negative rejection, no risk/verdict field, TouchEstimate consumption with unknown/invalid carried through, malformed estimate rejected, changed paths required, no estimator export, unresolved path not proven isolated, deleted path, rename old+new, no durable store surface, shared guard reuse, no evidence-graph/touch/pack dependency"
        - "no primary source document exists: source is a RESEARCH_NOTE ref only"
    provenance_note: "post-checkpoint research ingestion 2026-09-23; STUDY_ONLY sources; subagent-classified"
    history:
      - {date: 2026-10-01, action: imported, note: materialized from requirements.json}

