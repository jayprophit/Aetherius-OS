      paths:
        - "Aetherius-OS/src/eval/traceCorrelation.ts"
    evidence:
      tests:
        - "Aetherius-OS/src/eval/traceCorrelation.test.ts"
      notes:
        - "2026-09-23 classification: LIKELY partial; per-leg traces exist, no joined evaluation"
        - "selected by deterministic selector 2026-09-26"
        - "the registered evidence names the gap exactly: per-leg traces exist, so the JOIN plus accounting plus the runner were implemented and the individual legs were not rebuilt"
        - "src/eval/traceCorrelation.ts: TRACE_LEGS (the 10 registered legs), LEG_STATES, legsForEnvelope, normalizeAccounting, correlateTrace, runTraceEvaluation"
        - "VENDOR-NEUTRAL BY CONSTRUCTION: correlation is built on this repository's own EventEnvelope (correlationId, causationId, occurredAt). No OpenTelemetry/Jaeger/Datadog/Prometheus dependency exists in package.json and none was added; export names are tested to contain none of them"
        - "EventDomain was NOT widened: it has exactly five members (scheduler/realtime/workflow/steward/bridge) and cannot express ten legs, so an explicit visible DOMAIN_TO_LEGS mapping plus an eventType-prefix mapping is used and an unmappable envelope is reported rather than assigned a default leg"
        - "CORRELATION != CAUSATION: only envelopes naming the SAME correlationId are joined, a correlationId is never invented for an envelope lacking one, and causation edges are taken from causationId ONLY - a correlation group with no causation reports an empty chain rather than a fabricated one"
        - "LEG UNRECORDED != LEG DID NOT RUN and != LEG PASSED: every one of the 10 legs is reported, UNRECORDED carries a reason, and there is no SKIPPED or PASSED state. Incomplete traces are listed, never dropped"
        - "NO TOKENIZER != ZERO TOKENS and NO COST SOURCE != ZERO COST: both are OBSERVED only when a value AND a named source are supplied; an un-sourced number is not an observation. There is no tokenizer runtime anywhere in this repository, so exact token counts are caller-supplied or absent and never estimated from a model name"
        - "REAL BUG FOUND BY TEST AND FIXED: normalizeAccounting accepted a bare number as OBSERVED, contradicting its own documented contract that a value AND a source are both required. Now an un-sourced token count or cost is UNAVAILABLE with a reason"
        - "AGGREGATES DO NOT SUBTOTAL: runTraceEvaluation totals a dimension only when EVERY trace observed it, because summing over a subset would silently understate; a partially observed dimension is null, not a subtotal"
        - "ONLINE EVAL != TRAINING and ONLINE EVAL != AUTOMATIC SELF-MODIFICATION: the runner joins and accounts only. It produces no score, rating, rank, winner, grade, percent or correlation figure, and no self-modification surface"
        - "25 tests: exact 10-leg vocabulary, UNRECORDED distinct with no SKIPPED escape, EventDomain not widened, leg mapping from eventType and honest unmappable report, join restricted to the named correlationId with no invented group, all legs reported with reasons, event ordering by occurredAt then id, correlationId and duplicate-event rejection, unknown-key rejection, causation edges from causationId only, no causal chain for a mere correlation, accounting UNAVAILABLE with reasons, source-required observation, NaN/Infinity/negative rejection, observed vs invoiced cost distinction, deterministic trace ordering, per-leg coverage counting the unrecorded, incomplete traces listed not dropped, totals only when fully observed, no partial subtotal, no composite or ranking surface, vendor neutrality, no provider/store/registry surface"
        - "no primary source document exists: source is a RESEARCH_NOTE ref only"
