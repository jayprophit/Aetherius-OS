  - id: REQ-bridge-gate-compat
    name: "Bridge default-deny gate compatibility"
    type: requirement
    description: "Wire policy gate to real default-deny engine with session-scoped workspace grants; fix resulting runtime regressions."
    domain: agent-bridge
    primary_parent: CAP-bridge-policy-engine
    requirement_id: REQ-bridge-gate-compat
    required: true
    phase: P14
    priority: 5
    status_from_requirement: true
    implementation:
      paths:
        - "Agent-Bridge/aether_policy_bridge.py"
        - "Agent-Bridge/bridge.py"
        - "Agent-Bridge/executor.py"
        - "Agent-Bridge/runtime.py"
    evidence:
      tests:
        - "Agent-Bridge/tests/test_approved_grant_mutations.py"
        - "Agent-Bridge/tests/test_external_approvals.py"
        - "Agent-Bridge/tests/test_policy_deny_gate.py"
      notes:
        - "186/186 pytest"
        - "probe sibling/traversal/session isolation"
        - "defect D3 proved while building the IDE vertical slice: ASK_RISKY/ASK_ALL_WRITES/REQUIRE_APPROVAL carried read/list grants only, so the executor's default-deny gate refused every mutation even after a human approved it - the most supervised modes were the least functional, and the failure was buried in history as POLICY_DENIED"
        - "an approval verdict is now materialized as a narrow single-action grant for exactly the approved resource (aether_policy_bridge.issue_approved_action_grant) before the same policy evaluation runs, and revoked as soon as the dispatch returns, so an approval is one effect and not a standing capability; globs, workspace escapes and absolute/namespaced references are refused"
        - "defect D1: a served session could never surface a pending approval (create_session hard-coded non_interactive=True), so an ASK_* session silently denied instead of asking; the channel is now opt-in and refused with 403 when the runtime switch is off"
        - "defect D2: a run whose every mutation was denied reported COMPLETED with a positive reviewer verdict; build_task_result now derives effect_achieved/denied_actions/blocked from the execution journal and the recorded authority decisions"
        - "Executor.policy_resources now gates every resource an action touches, so an approved move/copy can no longer carry an unchecked destination"
        - "tests/test_external_approvals.py 25 tests over real HTTP (approve/deny/cancel/bad decision/token, single-use proof) and tests/test_approved_grant_mutations.py proving 8 mutations of these properties turn the suite red; pytest 1280 passed / 1 skipped, unittest discover 1271 OK"
    provenance_note: "BRIDGE-GATE-COMPAT/1 + POLICY-HARDENING/1 session records"
    history:
      - {date: 2026-10-01, action: imported, note: materialized from requirements.json}

