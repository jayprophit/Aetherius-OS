        - "src/eval/completionBenchmark.ts: COMPLETION_FACETS (the 13 facets the requirement names), UNAVAILABLE_REASONS, projectFacets, buildCompletionTrial, runCompletionBenchmark, toHarnessTrials"
        - "HONEST COVERAGE: only 9 of the 13 named facets have a backing TrialObservations field. correctness, violations, quality and recovery have NO field and are reported UNAVAILABLE with a documented reason, never proxied. violations is explicitly NOT escalations. quality is a composite and is never synthesised from the other facets. Unrecorded tokens/cost are UNAVAILABLE, not zero."
        - "success is reported as successVerified with successClaimed kept distinct: SUCCESS CLAIMED != SUCCESS VERIFIED"
        - "CONTAMINATION FAIRNESS reuses the guard from src/eval/contamination.ts via independentEvidenceFor. SEALED VAULT: a sealed partition is never independent on its label alone (the contamination layer already refuses it, and this module adds defence in depth). train/validation are expected-visible by design and can never be independent evidence."
