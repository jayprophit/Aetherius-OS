  - id: REQ-ide-genesis-task-loop
    name: "IDE-hosted Genesis task loop with human approvals and effect truth"
    type: requirement
    description: "The IDE could display bridge approvals but had no way to submit a task, no way to see a session's pending approval ids, and no way to approve or deny one, so the minimum harness loop (user -> IDE -> Genesis -> P25 authorization -> Agent Bridge -> bounded action -> world-state readback -> IDE-visible evidence) was unreachable from the UI. Adds the session, task, approval-decision and effect-readback surface plus the human-in-the-loop bar, and renders a refused run as blocked rather than as a success."
    domain: ide
    primary_parent: CAP-ide-task-loop
    relationships:
      depends_on: [REQ-runtime-inspection, REQ-bridge-gate-compat]
    requirement_id: REQ-ide-genesis-task-loop
    required: true
    phase: P23
    priority: 1
    status_from_requirement: true
    implementation:
      paths:
        - "IDE-Workspace/workspace/app/src/genesisBridge.ts"
        - "IDE-Workspace/workspace/app/src/components/GenesisTaskBar.tsx"
        - "IDE-Workspace/workspace/integration/bridge_client.py"
        - "IDE-Workspace/workspace/integration/bridge_service.py"
    evidence:
      tests:
        - "IDE-Workspace/workspace/app/src/genesisBridge.test.ts"
        - "IDE-Workspace/workspace/app/src/components/GenesisTaskBar.test.tsx"
        - "IDE-Workspace/workspace/integration/tests/test_bridge_vertical_slice.py"
      notes:
        - "the gap was measured from code, not docs: the TypeScript client had no /v1/sessions, /tasks, /approvals or /export call at all, the inspector's approval rows were display-only and anonymous (approval-0, approval-1) with no id to act on, and the status bar's verification field was a hardcoded idle"
        - "workspace/app/src/genesisBridge.ts adds the session/task/approval/effect surface over the Bridge's documented /v1 API, with tolerant parsers that never invent state and read a missing effect_achieved as false"
        - "workspace/app/src/components/GenesisTaskBar.tsx renders a pending approval with its real action and risk, offers a decision only when the session reports a decision channel, and renders a run whose actions were all denied as blocked even when the Bridge status is COMPLETED"
        - "workspace/integration/tests/test_bridge_vertical_slice.py: 7 tests over real HTTP against the unmodified Agent Bridge service - approve -> act -> world-state readback -> evidence, approve-once leaves no standing grant, a second approval is refused, deny -> no effect and a blocked outcome, cancel of a waiting approval, and no decision channel -> session creation refused and asks denied rather than faked"
        - "the three defects the slice exposed are recorded in REQ-bridge-gate-compat and docs/phase-b-vertical-slice.md"
    provenance_note: "Phase B IDE minimum-harness audit; the missing seam was proved by attempting the loop"
    history:
      - {date: 2026-10-01, action: imported, note: materialized from requirements.json}

  - id: REQ-bridge-action-intake
    name: "Structured action intake on Agent Bridge (POST /v1/actions)"
    type: requirement
    description: "Agent Bridge accepts free-text tasks but no typed action request, while Aetherius already has a tested BridgeActionRequest executor pointing at a route that does not exist. Without this, the Genesis action-proposal seam cannot reach execution: Genesis proposes, P25 decides, and there is no path from the decision to a real bounded action."
    domain: agent-bridge
    primary_parent: CAP-bridge-typed-intake
    relationships:
      depends_on: [REQ-p19-executors, REQ-bridge-gate-compat]
    requirement_id: REQ-bridge-action-intake
    required: true
    phase: P19
    priority: 1
    status_from_requirement: true
    implementation:
      paths:
        - "Agent-Bridge/actions.py"
        - "Agent-Bridge/service.py"
        - "Agent-Bridge/runtime.py"
        - "Agent-Bridge/client.py"
        - "Agent-Bridge/docs/api_schema_v05.json"
    evidence:
      tests:
        - "Agent-Bridge/tests/test_actions_intake.py"
        - "Agent-Bridge/tests/test_actions_intake_mutations.py"
      notes:
        - "POST /v1/actions and GET /v1/actions/{action_id} implemented in Agent Bridge (commit ee9289b): the route is an adapter into the session/task fabric, reusing protocol.validate_action, the session approval gate, the policy engine, the canonical executor and the session journal - nothing reimplemented"
        - "directed tasks carry the decided action through the normal worker thread with a per-task provider override, so approval pauses surface on the existing approvals endpoint, the journal records the full loop, and responses map session truth into the BridgeOutcome vocabulary (DENIED only when actions were denied without effect; reads completing without effect are SUCCEEDED)"
        - "fail-closed rules proven over real HTTP: malformed/missing/invented actions, loop-control finish, move/copy without dest, globs/escapes/absolute refs on resource AND destination, malformed principals, bad owner_mode strings, workspace escapes, unknown session labels, token mismatches, unknown action ids"
        - "authority rules proven: owner_mode OWNER* without runtime owner authorization is 403; interactive sessions require the runtime external-approvals switch (403); ASK without interactivity denies fail-closed with no phantom approval; valid principals pass as audit context only and never authority"
        - "replay rules proven: same id plus same fingerprint returns the recorded task without re-executing (deduped=true, verified by external modification surviving replay); same id plus different fingerprint is a 409 collision, never an alias"
        - "single-use approvals survive the endpoint: an approved write leaves no standing grant, verified by probing the policy engine after execution"
        - "response contract: POST waits boundedly (wait_ms, default 30s, max 300s) and returns a settled outcome - WAITING_APPROVAL with a resolvable approval_id, TIMED_OUT with poll instructions on expiry, never an invented terminal value; GET reports the same mapping, UNKNOWN_OUTCOME with live status for running tasks"
        - "Agent Bridge full gates at commit: pytest 1319 passed / 1 skipped / 22 subtests; repo-declared unittest discover 1310 OK / 1 skipped"
        - "NOT claimed here: the Genesis-to-BridgeActionRequest adapter and the five end to end scenarios are downstream integration work and remain open; this requirement covers the endpoint only"
    provenance_note: "found by attempting the Genesis proposal seam and searching for existing contracts before designing"
    history:
      - {date: 2026-10-01, action: imported, note: materialized from requirements.json}
