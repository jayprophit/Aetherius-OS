  - id: REQ-p16-evidence-traceability
    name: "Machine-checkable evidence traceability for the registry"
    type: requirement
    description: "Every COMPLETE requirement must be traceable to something a machine can check. The registry validator only required that evidence be a non-empty array of non-blank strings, so prose satisfied it and a COMPLETE requirement could cite paths that do not exist with no check failing. Audits traceability per requirement: which citations resolve, which dangle, and whether a COMPLETE claim has a resolvable test citation."
    domain: aetherius-os
    primary_parent: CAP-programme-registry
    relationships:
      depends_on: [REQ-p16-control]
    requirement_id: REQ-p16-evidence-traceability
    required: true
    phase: P16
    priority: 2
    status_from_requirement: true
    implementation:
      paths:
        - "Aetherius-OS/src/programme/evidenceTrace.ts"
    evidence:
      tests:
        - "Aetherius-OS/src/programme/evidenceTrace.test.ts"
        - "Aetherius-OS/src/programme/evidenceTrace.audit.test.ts"
      notes:
        - "the gap was measured before it was fixed: the Requirement type declares test_refs and implementation_refs for exactly this purpose and 0 of 107 requirements populated either, so all 92 COMPLETE claims rested on prose alone"
        - "validateProgramme checks only that evidence is a non-empty array of non-blank strings (src/programme/validate.ts); no existing code could distinguish a verifiable completion claim from an unverifiable one"
        - "src/programme/evidenceTrace.ts implements the audit: extractPathCitations, auditEvidenceTrace, summariseEvidenceTrace, 35 unit tests in src/programme/evidenceTrace.test.ts"
        - "READ-ONLY: the auditor never edits a requirement, never proposes a work_state change and never repairs a dangling citation; path resolution is injected (PathResolver) so the module stays pure, deterministic and disk-free"
        - "NO SCORE AND NO AUTHORITY: traceClass is a recorded structural fact about the shape of a claim (MACHINE_REFS / CITED_PATHS / PROSE_ONLY / DANGLING_CITATION / NO_EVIDENCE), never a judgement of whether the work was done or is good enough; nothing promotes, closes or ranks a requirement"
        - "a declared machine ref naming a missing file is still DANGLING_CITATION and never counts as a test citation - declaring a path does not make it exist; this was a real defect in the first implementation, caught by its own test, and fixed in hasTestCitation"
        - "two real path conventions exist in the registry and both are declared rather than guessed: repo-root-relative (src/release/packaging.ts) and src-relative shorthand (for example src/runners/sync.ts, six occurrences); DEFAULT_SEARCH_PREFIXES searches exactly those two and records which prefix matched, so an undeclared convention is reported instead of inferred"
        - "verified fact recorded as testable: owner names the accountable PROJECT, not the repository holding the code; 8 requirements owned by genesis/ide/mat resolve inside the Aetherius-OS monorepo (Genesis is a C++ tree with no such TypeScript module, IDE-Workspace has no src/monitoring, MAT has neither docs/context-layers.md nor src/context/layers.ts), so the audit searches each project repo and the monorepo"
        - "src/programme/evidenceTrace.audit.test.ts audits the REAL registry rather than a fixture and pins the true baseline: 107 requirements, 92 COMPLETE, 70 COMPLETE claims with no resolvable test citation, 0 using machine refs, exactly 4 dangling citations"
        - "the 4 dangling citations are the fixture filenames user.ts, userService.ts, userServiceHelper.ts and consumer.ts quoted inside evidence prose describing defects that tests found; they are left reported and unrewritten because rewriting them into src/-relative paths would fabricate files - classification belongs to a human, not to the auditor"
        - "the audit is exhaustive: a COMPLETE requirement can never be silently skipped, and the registry file is asserted byte-identical after auditing"
        - "an earlier ad-hoc script and the finished module were computed independently and agree on 70 untraceable COMPLETE claims; the module initially reported 75 and 29 dangling citations purely because its first path mapping searched each owner's own repository only, which the verified cross-owner finding above corrects"
        - "NOT a remediation: the 70 untraceable COMPLETE claims are recorded as an open evidence-hygiene finding; populating implementation_refs/test_refs for the remaining requirements is real follow-up work requiring per-requirement verification that the cited test actually proves that requirement, and is not asserted here"
