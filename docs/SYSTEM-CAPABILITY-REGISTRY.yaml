        - "FIXED CONDITIONS: the whole ControlledConditions block is required, tool order is compared as a set, and drifted trials are reported in confoundedTrialIds and excluded from toHarnessTrials. startingState is preserved on the completion trial because TrialConditions omits it."
        - "27 tests: exact 13-facet vocabulary, four unsupported facets UNAVAILABLE with reasons, no quality synthesis, no violations-from-escalations, verified-not-claimed success, unrecorded tokens/cost UNAVAILABLE, observed tokens/cost when recorded, deterministic facet order, trial validation, all controlled fields required, drift detection, tool-order insensitivity, no input mutation, sealed/train/validation never independent, per-partition assessment matching, facet coverage counts, no composite/winner, deterministic ordering, empty-trial rejection, existing compareHarness consumption, confounded exclusion, no re-implemented comparison, no redefined contracts, no second framework surface"
