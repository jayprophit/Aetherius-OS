# =============================================================================
# SYSTEM CAPABILITY REGISTRY — authoritative source (BUILD61)
# =============================================================================
# This file is the programme's persistent capability/component source of truth.
# Rules:
#  - Stable IDs are permanent; hierarchy position is not. Move with history.
#  - REQ-* concepts are NOT duplicated here: they materialize at load from
#    src/programme/requirements.json (see requirement_parents below).
#  - Statuses are evidence-backed. No implementation path this author verified
#    -> never IMPLEMENTED or above. When in doubt: RESEARCH or NOT_STARTED.
#  - The Markdown report is generated. Never hand-edit it to change meaning.
#  - GENERATED SECTION at the end is written by scripts/import_requirements.py.
#    Do not hand-edit below the marker.
# =============================================================================
