  - id: REQ-p20-collision-predictor
    name: "Worker collision prediction"
    type: requirement
    description: "Forecast cross-worker collisions from touch sets, branches and merge order before execution; reactive serialization already exists, prediction does not."
    domain: aetherius-os
    primary_parent: CAP-aetherius-os-platform
    relationships:
      depends_on: [REQ-p20-expected-touch-set]
    requirement_id: REQ-p20-collision-predictor
    required: true
    phase: P20
    priority: 1
    status_from_requirement: true
    implementation:
      paths:
        - "Aetherius-OS/src/workers/collisionPrediction.ts"
    evidence:
      tests:
        - "Aetherius-OS/src/workers/collisionPrediction.test.ts"
      notes:
        - "2026-09-23 classification: NEW; serialization is reactive, oracle is quality-verdicts"
        - "selected by deterministic selector 2026-09-26"
        - "the REACTIVE SERIALIZATION THAT ALREADY EXISTS is applySync/SyncConflictPolicy in src/runners/sync.ts, which reports a conflicts list when a sync actually happens; that remains the reactive oracle and is referenced by policy name, never reimplemented, wrapped or replaced"
        - "src/workers/collisionPrediction.ts: COLLISION_KINDS (SHARED_WRITE, DEPENDENT_WRITE - two structural classes), forecastCollisions, PlannedWorker, CollisionPair, CollisionForecast"
        - "FORECAST FROM THE THREE REGISTERED INPUTS: touch sets (each worker's TouchEstimate, consumed not re-estimated), branches, and merge order. TouchEstimate.unknown is carried through so an unestimated plan is NOT cleared of collisions - it lands in unpredictable[] with the estimator's own reasons, and its paths are not counted as collisions"
        - "DEPENDENT_WRITE IS A REAL TWO-HOP JOIN, NOT A NAME GUESS: for a path P written by worker W, the graph's importing FILES of P are intersected with each other worker's OWN predicted touch set. A worker that merely has a similarly named file is unaffected. With no graph supplied, only SHARED_WRITE can be predicted and that limitation is the honest result rather than a guess at dependency structure"
        - "REAL BUG FOUND BY TESTS AND FIXED: the first implementation treated the graph's importing FILES as if they were WORKER ids, so a dependent-write pair came out as ['src/consumer.ts','w1']. The two-hop join through each worker's predicted touch set is now explicit. Typecheck independently caught a second defect in the same block - a typo made `const workers = pairKey(writers[i]!, workers[j]!)` self-reference its own initializer (TS2448), which is why GREEN TESTS != TYPE-CORRECT CODE remains mandatory"
        - "A FORECAST IS NOT A PREVENTION AND NOT A PROOF: PREDICTION != PREVENTION; PREDICTED COLLISION != OBSERVED COLLISION; NO PREDICTION != NO COLLISION. The forecast names the reactive policy that remains the actual oracle, and the only test asserting observable reality (applySync throwing on conflict) is left untouched in runners.test.ts"
        - "NO PROBABILITY AND NO SCORE: two plans either share a predicted path or they do not, which is decidable; a collision probability would be an invented number. noProbability is literal true and there is no probability/confidence/score/risk/verdict/rank/winner/rating/severity field"
        - "MERGE ORDER IS REPORTED, NEVER SILENTLY REORDERED: two branches claiming the same merge position produce mergeOrderClashes; two workers on the SAME branch at the same position do not, since that is one branch, not a clash"
        - "TOUCH PREDICTION != CODE DEPENDENCY and TOUCH SET != EXECUTED COLLISION: this predicts from ESTIMATES before execution and never claims an execution-time fact"
        - "23 tests: shared-write prediction, disjoint plans producing nothing, all shared paths collected on a pair, deterministic pair ordering from reversed input, two-class vocabulary, dependent-write via real dependency structure, NO dependent prediction without a graph, no inference from name similarity, same-path write not reported as a self-dependency, unpredictable workers not cleared and not counted as colliding, all estimator reasons carried, merge-order clash reported and distinct positions not flagged, same-branch not flagged, reactive policy named and invented policy rejected, no probability/score field, no reimplementation of applySync or sync/merge/lock/lease/serialize surface, empty and malformed worker rejection, duplicate worker rejection, unknown-key rejection, no input mutation"
        - "no primary source document exists: source is a RESEARCH_NOTE ref only"
    provenance_note: "post-checkpoint research ingestion 2026-09-23; STUDY_ONLY sources; subagent-classified"
    history:
      - {date: 2026-10-01, action: imported, note: materialized from requirements.json}

