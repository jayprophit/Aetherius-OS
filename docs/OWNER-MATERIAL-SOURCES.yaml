# =============================================================================
# OWNER MATERIAL SOURCES - every source the owner has provided
# =============================================================================
# The owner has provided the programme's design material in several
# places: the master handoffs, the fork use case catalogue, the prompt
# documents, the ChatGPT library files, and the reference source trees.
#
# They are listed here rather than discovered, because a source that is
# not listed is a source nobody knows exists. Each entry says what the
# source is and how it may be used.
#
# Reading rules:
#  - A credential store is recorded and never opened.
#  - Third-party source trees are inventoried and classified, and their
#    text is not published.
#  - The owner's own documents are read, and what they say is extracted
#    into the registers.
#
# Related:
#  docs/SOURCE-REGISTRY.yaml     - the register of source material
#  docs/OWNER-DIRECTIVES.yaml    - the standing rules in the owner's words
#  docs/PROJECT-TODOS.yaml       - the work that is outstanding
# =============================================================================
