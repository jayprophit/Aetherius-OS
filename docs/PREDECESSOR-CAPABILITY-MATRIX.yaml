- The measurement is computed and the judgement is recorded. The measurement is how many files, lines,
  tests and duplicates are really there. The judgement is which capability maps to which current component
  and with what disposition, and it is a decision, written down with its reason rather than re-derived
  by a heuristic on every run.
- Every route module of a predecessor has to land in exactly one capability area. The tool says which
  ones are unaccounted for, because a matrix that quietly leaves things out is worse than no matrix.
- A disposition is not an integration. Nothing here has been integrated into a current project, and the
  register's own deletion gates are still to be checked one by one.
- LEGAL_REVIEW on a row means the material cannot be used until the licence question is answered, not
  that it has been rejected.
