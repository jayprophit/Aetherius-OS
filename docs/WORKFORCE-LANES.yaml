notes:
- The lanes are the write sets, not the wish lists. Two lanes may run at the same time only if their write
  sets do not overlap, and the tool checks every pair and says which pair conflicts.
- 'The work, the activity and the CI state are measured. The starvation gap is a measurement too: how
  much older a lane''s last activity is than the newest activity across the lanes.'
- A lane with open work and no next action is a lane that is not ready, and the tool says so rather than
  leaving it to be noticed.
- A predecessor is only ever read, never written. A predecessor's deletion is the owner's separate decision,
  and this register never proposes one.
