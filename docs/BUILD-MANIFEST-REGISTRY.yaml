schema_version: 1.0.0
source_date: '2026-10-29'
projects_root: ..
predecessor_candidates:
  register: docs/PREDECESSOR-CANDIDATE-REGISTER.yaml
  count: 10
  note: >-
    Ten build-registry projects are candidates for predecessor status but are not
    confirmed. They are recorded separately from the six owner-confirmed
    predecessors in docs/PREDECESSOR-MIGRATION-REGISTRY.yaml and are not treated
    as absorbed, deleted or rewritten until evidence or the owner classifies them.
projects:
- id: aetherius-os
  name: Aetherius-OS
  manifest: Aetherius-OS/build.yaml
  role: The Aetherius IDE and programme registry. Owns the requirement, capability, invention and evidence
    registries, and the workspace hygiene guard for the Projects folder.
  status: VERIFIED
  depends_on:
  - genesis
  - agent-bridge
  - mat
  notes: Hosts the build manifest registry and the project todo list. Its own test suite is the gate for
    every registry in the ecosystem.
- id: genesis
  name: Genesis
  manifest: Aetherius-OS/kernel/Genesis/build.yaml
  role: 'The AI agent: a living, systemic organism, and the kernel of Aetherius OS. It is also an agent
    you can download and use on its own, and it is part of the IDE.'
  status: VERIFIED
  depends_on:
  - mat
  notes: 'Genesis is the kernel of Aetherius OS and it is also a downloadable AI agent in its own right,
    and it is part of the IDE. It keeps its own repository and its own remote, because a project you can
    download on its own cannot be a subdirectory of another project''s repository: the subdirectory would
    have no history of its own. It lives at Aetherius-OS/kernel/Genesis so that the ownership is visible
    on disk, and Aetherius OS''s gitignore excludes it so that the kernel does not track it.'
- id: agent-bridge
  name: Agent-Bridge
  manifest: Agent-Bridge/build.yaml
  role: The local-first bridge runtime. Connects small AI models, tools and devices, and is where delegation,
    policy and the MCP adapter live.
  status: PARTIAL
  depends_on:
  - genesis
  - mat
- id: ide-workspace
  name: IDE-Workspace
  manifest: Aetherius-OS/apps/IDE-Workspace/build.yaml
  role: 'The IDE: an app of Aetherius OS that may also be used by other operating systems.'
  status: VERIFIED
  depends_on:
  - genesis
  - agent-bridge
  - mat
  notes: 'The IDE is an app of Aetherius OS, and it is also meant to run on other operating systems. It
    therefore does not depend on Aetherius OS: it depends on Genesis, Agent-Bridge and MAT, which it can
    reach wherever they are installed. It keeps its own repository and its own remote so that it can be
    used without Aetherius OS at all.'
- id: mat
  name: Materials Atlas Table Codex
  manifest: Materials-Atlas-Table-Codex---MAT/build.yaml
  role: 'The owner''s own periodic table: a structured scientific knowledge system for describing matter,
    materials, states and transformations beyond the limits of a conventional periodic table. It is the
    substrate the rest of the programme processes data with. It is not finished.'
  status: PARTIAL
  depends_on: []
  notes: 'MAT is the owner''s own periodic table and it is a substrate rather than a consumer. Genesis,
    Aetherius OS, Agent-Bridge and the other agents and subagents use it to process data, so every one
    of them depends on it and it depends on none of them.

    It is not finished. It is still being worked on by the Codex desktop app on a scheduled five-hour
    window, and the work is pending. The status below is therefore PARTIAL even though the build validates,
    because the build passing is not the same as the atlas being complete. Nothing downstream should read
    MAT as a finished reference.'
- id: poietek
  name: Poietek
  manifest: Aetherius-OS/apps/Poietek/build.yaml
  role: The creative production surface. Tauri desktop and web build over a native audio core.
  status: VERIFIED
  depends_on: []
- id: universal-bridge
  name: Universal-Bridge
  manifest: Aetherius-OS/apps/Poietek/absorbed/Universal-Bridge/build.yaml
  role: The hardware and session bridge. Connects DAW sessions to local devices through a capability-aware
    preflight path.
  status: VERIFIED
  depends_on:
  - poietek
- id: ledgerlands
  name: LedgerLands
  manifest: Aetherius-OS/apps/LedgerLands/build.yaml
  role: The property-trading strategy and GameFi application. An npm-workspaces monorepo with a Fastify
    server-authoritative API, a React gameplay UI, a deterministic game engine and a Prisma schema.
  status: VERIFIED
  depends_on:
  - aetherius-os
  notes: Three related trees are present under the folder. The build manifest records which one is authoritative
    as an open task, not as a fact.
- id: agent-bridge-cloudhybrid
  name: Agent-Bridge (cloud-hybrid runtime)
  manifest: Agent-Bridge/variants/cloudhybrid/build.yaml
  role: The local/cloud/hybrid runtime branch of Agent Bridge, plus its readiness audit.
  status: PARTIAL
  depends_on:
  - agent-bridge
  - genesis
  notes: A branch worktree of the same repository, on unit/cloud-hybrid-runtime. It is a variant of one
    project, not a project of its own, and it lives inside the Agent-Bridge folder.
- id: agent-bridge-dashboard
  name: Agent-Bridge (supervisor UI / worker telemetry)
  manifest: Agent-Bridge/variants/dashboard/build.yaml
  role: The supervisor UI and external worker telemetry branch of Agent Bridge.
  status: PARTIAL
  depends_on:
  - agent-bridge
  - ide-workspace
  notes: A branch worktree of the same repository, on unit/external-worker-telemetry. It is a variant
    of one project, not a project of its own, and it lives inside the Agent-Bridge folder.
- id: agent-bridge-runtimesafety
  name: Agent-Bridge (runtime safety)
  manifest: Agent-Bridge/variants/runtimesafety/build.yaml
  role: The runtime safety fixes branch of Agent Bridge, plus the cloud/hybrid audit resolution.
  status: PARTIAL
  depends_on:
  - agent-bridge
  - genesis
- id: hermes-config-audit
  name: Hermes-Config-Audit
  manifest: Aetherius-OS/tools/Hermes-Config-Audit/build.yaml
  role: The audit record of the Hermes model, provider and tool configuration. Documentation, not code.
  status: VERIFIED
  depends_on:
  - aetherius-os
  notes: Holds credential NAMES only. No secret values were read, copied or logged anywhere in this tree.
- id: athena
  name: Athena
  manifest: Aetherius-OS/apps/Athena/build.yaml
  role: 'The shared intelligence runtime: routing, tools, planning, memory, delegation, durable tasks,
    evaluation and a local-model contract. Candidate scope until the original Athena requirements are
    recovered.'
  status: PARTIAL
  depends_on:
  - aetherius-os
  - agent-bridge
  notes: The runtime and tests are built. The owner's original Athena requirements live in a ChatGPT
    project that is not in the local corpus, so the implemented capability set is candidate scope
    (TODO-ATH-002). No hosted model provider or user interface is connected.
- id: architecture-of-shadows-book
  name: Architecture of Shadows Book
  manifest: Aetherius-OS/books/Architecture of Shadows Book/build.yaml
  role: 'A reference work on the global drug trade, in three editions: a master edition of sixteen volumes
    and four hundred and three chapters, a student edition, and a web version. EPUB is built with Pandoc;
    PDF is Pandoc HTML printed by headless Edge.'
  status: PARTIAL
  depends_on: []
  notes: The content was a public repository that had never been brought into the workspace, so the register
    described an empty folder and the folder was empty. The project is now cloned into the place the register
    names, and the manifest counts the tree rather than describing it. All four artifacts were built and
    structurally verified on 2026-10-29. Master EPUB 0.57 MB / 410 spine items and PDF 8.60 MB / 462 pages;
    student EPUB 0.51 MB / 365 spine items and PDF 7.47 MB / 397 pages. The PDF path is Chromium A4, not
    XeLaTeX, and there is no print-ready letter PDF. The title page still has three metadata placeholders,
    the title and copyright pages say 17-Volume on a 16-volume tree, and no epubcheck or editorial review
    has run. The MAT publication toolchain already provides a validated-record build, a glossary build,
    a source-navigation build and a Playwright-backed studio, which a book of this size would be materially
    served by.
  repository: https://github.com/jayprophit/THE-ARCHITECTURE-OF-SHADOWS
- id: decentralized-messaging-app
  name: Decentralized Messaging App
  manifest: Aetherius-OS/apps/Decentralized Messaging App/build.yaml
  role: 'The messaging slice: encrypted storage, membership, presence, notifications, attachments, call
    signalling and signed federation envelopes, built on the Agent-Bridge communication core.'
  status: PARTIAL
  depends_on:
  - aetherius-os
  - agent-bridge
  notes: The messaging core and tests are built. There is no WebRTC media plane, no live federation
    transport and no messaging user interface. The product requirements are candidate scope
    (TODO-DMA-002), not recovered owner requirements.
