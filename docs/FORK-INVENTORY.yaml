# Aetherius fork / upstream inventory (BUILD85-R4).
# Rule: FORK WHAT WORKS. Every entry records provenance; nothing here is
# rebranded as first-party. Statuses: ACCEPT / ACCEPT_WITH_PATCHES / EVALUATE /
# REJECT / SUPERSEDED / REFERENCE_ONLY.
forks:
